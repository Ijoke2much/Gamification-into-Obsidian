name: Release plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f main.js
          test -f manifest.json
          test -f styles.css
          NOTES="Gamified Obsidian ${TAG}

BRAT install: Community plugins → BRAT → Add beta plugin → https://github.com/Ijoke2much/Gamification-into-Obsidian

BRAT only downloads these attachments: manifest.json, main.js, styles.css (sprites are inlined).

See README.md in the repo for first-open, themes, and how this differs from a git checkout inside .obsidian/plugins."
          PRERELEASE_FLAG=()
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            "${PRERELEASE_FLAG[@]}" \
            main.js manifest.json styles.css
